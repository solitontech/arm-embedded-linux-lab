# ==============================================================================
# dnsmasq — DHCP only for RPi4 EEPROM network boot
# TFTP is served by tftpd-hpa (port 69) inside this same container.
# Do NOT enable enable-tftp here — it would conflict on port 69.
# ==============================================================================

# Listen only on the Pi-facing interface (override with DNSMASQ_INTERFACE env)
# interface=enp2s0
bind-interfaces

# Pin a specific Pi by MAC to a static IP (recommended for lab stability).
# Replace the MAC below with your board's MAC (find via serial console or router).
# dhcp-host=xx:xx:xx:xx:xx:xx,192.168.1.150,rpi4,infinite

# DHCP range for the Pi subnet
dhcp-range=192.168.1.150,192.168.1.160,255.255.255.0,12h

# Tell the TFTP client to fetch from this host (override with HOST_IP env)
# dhcp-boot=boot.scr,,192.168.1.220
dhcp-option=66,192.168.1.220
dhcp-option=67,boot.scr

# Log DHCP activity
log-dhcp
log-queries

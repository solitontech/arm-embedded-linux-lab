# ==============================================================================
# Kernel Config Fragment: Camera Support (IMX219 on CSI-2)
#
# Merge with bcm2711_defconfig when rebuilding the kernel:
#   cd rpi-linux
#   make bcm2711_defconfig
#   scripts/kconfig/merge_config.sh .config /path/to/camera_kconfig.cfg
#   make -j$(nproc) Image modules dtbs
#
# Then install modules to the NFS rootfs:
#   make modules_install INSTALL_MOD_PATH=/workspace/nfs/rpi4-rootfs
# ==============================================================================

# Media subsystem (V4L2 framework)
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2=y

# DMA buffer support for zero-copy frame sharing
CONFIG_VIDEOBUF2_CORE=y
CONFIG_VIDEOBUF2_DMA_CONTIG=y
CONFIG_VIDEOBUF2_MEMOPS=y

# BCM2835 Unicam CSI-2 receiver (the RPi4's camera interface)
CONFIG_VIDEO_BCM2835_UNICAM=m

# Sony IMX219 sensor driver (Camera Module v2)
CONFIG_VIDEO_IMX219=m

# I2C bus for sensor communication (camera registers are set via I2C)
CONFIG_I2C_BCM2835=y

# Fixed voltage regulator (camera power rail)
CONFIG_REGULATOR_FIXED_VOLTAGE=y
